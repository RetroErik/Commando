[sdl]
fullscreen=false
output=surface

[dosbox]
machine=cga
memsize=16
captures=test\capture

[render]
aspect=true
scaler=normal3x

[cpu]
core=normal
cputype=auto
cycles=5000

[mixer]
rate=44100

[sblaster]
sbtype=sb1
oplmode=opl2
oplemu=compat
oplrate=44100

[speaker]
pcspeaker=false

[autoexec]
@echo off
